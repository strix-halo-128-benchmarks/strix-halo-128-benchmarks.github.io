<svg role="img" aria-label="Peak memory bandwidth on a log scale, with the PCIe spill path for comparison. Bandwidth sets decode; whether there is a hard ceiling at all decides what runs. Bandwidth is quoted in decimal GB/s, as vendors publish it, while capacities on this page are GiB: 256 GB/s is 238 GiB/s" xmlns:xlink="http://www.w3.org/1999/xlink" width="746.994766pt" height="265.858594pt" viewBox="0 0 746.994766 265.858594" xmlns="http://www.w3.org/2000/svg" version="1.1"><title>Peak memory bandwidth on a log scale, with the PCIe spill path for comparison. Bandwidth sets decode; whether there is a hard ceiling at all decides what runs. Bandwidth is quoted in decimal GB/s, as vendors publish it, while capacities on this page are GiB: 256 GB/s is 238 GiB/s</title><desc>Peak memory bandwidth on a log scale, with the PCIe spill path for comparison. Bandwidth sets decode; whether there is a hard ceiling at all decides what runs. Bandwidth is quoted in decimal GB/s, as vendors publish it, while capacities on this page are GiB: 256 GB/s is 238 GiB/s — computed from the run archive, not drawn by hand.</desc>
